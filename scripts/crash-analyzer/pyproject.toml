[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crash-analyzer"
version = "0.1.0"
description = "Utilities for decoding crash information"
requires-python = ">=3.11"
license = "GPL-2.0-only"
authors = [
    {name = "Tu Dinh", email = "ngoc-tu.dinh@vates.tech"},
]

dependencies = [
    "pyelftools>=0.32",
]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[project.urls]
Homepage = "https://github.com/xcp-ng/hypervisor-dev"
Repository = "https://github.com/xcp-ng/hypervisor-dev"
Issues = "https://github.com/xcp-ng/hypervisor-dev/issues"

[project.scripts]
crash-analyzer = "crash_analyzer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/crash_analyzer"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]
